[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geopanel-eo"
version = "0.1.0"
description = "Auditable conversion of Earth observation rasters to longitudinal panel data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.2,<2.3", "pandas>=2.2,<4", "rasterio>=1.4,<2", "affine>=2.4,<3",
  "shapely>=2,<3", "pyproj>=3.6,<4", "pyogrio>=0.10,<1",
  "xarray>=2024.1", "h5netcdf>=1.3,<2", "h5py>=3.11,<4", "scipy>=1.14,<2", "exactextract==0.3.0",
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "pyarrow>=18"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.urls]
Homepage = "https://github.com/xbdqs/GeoPanel-EO"
Repository = "https://github.com/xbdqs/GeoPanel-EO"
Issues = "https://github.com/xbdqs/GeoPanel-EO/issues"

[project.scripts]
geopanel-eo = "geopanel_eo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
