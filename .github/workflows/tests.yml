name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned environment and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps .
      - name: Check dependency integrity
        run: python -m pip check
      - name: Run scientific-core tests with strict runtime warnings
        run: python -m pytest tests -q -W error::RuntimeWarning
      - name: Run reviewer synthetic and contract tests
        run: python -m pytest tests_review -q
