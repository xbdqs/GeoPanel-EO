name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "Python 3.12 / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned environment and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps .
      - name: Check dependency integrity
        run: python -m pip check
      - name: Run scientific-core tests with strict runtime warnings
        run: python -m pytest tests -q -W error::RuntimeWarning
      - name: Run reviewer synthetic and contract tests
        run: python -m pytest tests_review -q
      - name: Build Wheel and source distribution
        run: python -m build --wheel --sdist
      - name: Install built Wheel into a clean environment and test both CLI entry points
        run: python scripts/ci_verify_distribution.py
      - name: Archive release candidates
        uses: actions/upload-artifact@v4
        with:
          name: geopanel-eo-0.1.1-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
